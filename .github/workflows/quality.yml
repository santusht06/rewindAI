name: Quality gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy services
      - name: Check OpenAPI snapshot
        run: python ops/scripts/export_openapi.py --check
      - name: Exercise migration upgrade and rollback
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migration-check.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
